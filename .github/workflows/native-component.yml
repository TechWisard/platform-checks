name: Disconnected native component contracts

on:
  push:
    paths:
      - 'checks/component/**'
      - '.github/workflows/native-component.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            architecture: ARM64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure standalone component contracts
        run: cmake -S checks/component -B build/component -A ${{ matrix.architecture }}
      - name: Compile standalone component contracts
        run: cmake --build build/component --config Release --parallel 2
      - name: Verify installed metadata and disconnected properties
        timeout-minutes: 1
        shell: pwsh
        run: |
          & .\checks\component\run.ps1 -Executable .\build\component\Release\component_contract.exe
          exit $LASTEXITCODE
