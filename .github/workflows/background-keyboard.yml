name: Background keyboard API contract

on:
  push:
    branches: [main]
    paths:
      - 'checks/background-keyboard/run-request.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-keyboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  background_keys_arm64:
    name: Background keyboard (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure independent probes
        run: cmake -S . -B build -A ARM64
      - name: Compile independent session and window probes
        run: cmake --build build --config Release --target win32_session_environment win32_window_calibration --parallel 2
      - name: Configure first-logon preparation helper
        run: cmake -S checks/session/first-logon -B build/first-logon -A ARM64
      - name: Compile first-logon preparation helper
        run: cmake --build build/first-logon --config Release --parallel 2
      - name: Configure owned child Search preparation helper
        run: cmake -S checks/session/child-search -B build/child-search -A ARM64
      - name: Compile owned child Search helper and receipt contracts
        run: cmake --build build/child-search --config Release --target child_search_prepare child_search_receipt_tests --parallel 2
      - name: Check bounded receipt decoder
        run: .\build\child-search\Release\child_search_receipt_tests.exe
      - name: Query actual environment
        shell: pwsh
        run: |
          & .\build\Release\win32_session_environment.exe
          $probeExit = $LASTEXITCODE
          "probe_exit=$probeExit"
          if ($probeExit -eq 77) {
            "::notice::Session preflight unavailable; no connection attempted."
            exit 0
          }
          exit $probeExit
      - name: Report .NET SDK
        run: dotnet --info
      - name: Require frame, window input, then direct keys with own decoy foreground
        timeout-minutes: 8
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
        run: |
          & .\checks\session\first-logon\run-prepared.ps1 `
            -PreparationProgram .\build\first-logon\Release\first_logon_prepare.exe `
            -CalibrationProgram .\build\Release\win32_window_calibration.exe `
            -ChildSearchPreparationProgram .\build\child-search\Release\child_search_prepare.exe `
            -ResultsDirectory "$env:RUNNER_TEMP\background-keyboard-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            -AllowDisposablePrivacyPreparation -TestSendKeys -TimeoutSeconds 150
          exit $LASTEXITCODE
